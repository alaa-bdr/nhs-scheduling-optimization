[project]
name = "nbt-pipeline"
version = "0.1.0"
description = "NBT theatre scheduling preprocessing and analysis pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas",
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbt_pipeline"]
