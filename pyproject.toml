[project]
name = "nbt-pipeline"
version = "0.1.0"
description = "NBT theatre scheduling preprocessing and analysis pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ipykernel",
    "joblib",
    "matplotlib",
    "nbclient",
    "nbformat",
    "numpy",
    "pandas",
    "openpyxl",
    "scipy",
    "seaborn",
    "statsmodels",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbt_pipeline"]
