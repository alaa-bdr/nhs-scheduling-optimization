extract_task:
  description: >
    Read the following theatre note and extract the fields defined by the
    output schema. These notes are short operating-theatre booking notes, so
    focus on useful structured information that can be added back to the
    dataframe: main procedure, component actions, site, laterality, diagnoses
    or indications, duration, anaesthetic, admission setting, priority,
    urgency, histology/biopsy/specimen plan, closure or reconstruction plan,
    equipment, imaging, implants/materials, medications/injections,
    comorbidities/risk factors, anticoagulation, mobility/access needs,
    special instructions, and uncertainty.

    Only use information explicitly present in the note. Do not infer from
    general medical knowledge and do not guess missing values. If the note is
    empty or only punctuation, set has_extractable_note to false and leave the
    other fields empty, null, or not_stated as appropriate. For optional string
    fields, use null when absent. For list fields, use an empty list when
    absent. Do not use empty strings. Do not use 0 for missing durations.

    Normalise anaesthesia to GA, LA, regional, sedation, spinal, epidural, or
    other. Normalise laterality to left, right, bilateral, midline, or
    not_stated. Normalise case setting to day_case, inpatient, outpatient, or
    not_stated. Convert stated durations such as "4 HRS" or "90 mins" into
    expected_duration_minutes. Preserve question-marked or +/- alternatives in
    uncertainties instead of treating them as definite facts.

    If the note itself contains OPCS-like procedure codes, preserve them exactly
    in the procedure_codes_mentioned field. Do not invent or infer missing
    codes. Do not put priority codes such as P2, P3 or P4, urgency text such as
    2WW, or anaesthetic codes such as GA/LA in procedure_codes_mentioned.
    Negative statements such as "Xray no" or "X-ray No" mean imaging is not
    requested; do not add them to imaging_required.
    Do not put anaesthetic-only values such as GA or LA in
    procedure_components. Do not put duration or admission setting text such as
    "60 mins" or "day case" in special_instructions; use the duration and
    case_setting fields.

    Theatre note:
    {theatre_note}
  expected_output: >
    A draft JSON object matching the TheatreNoteExtraction schema, with no
    invented information.
  agent: extractor

review_task:
  description: >
    Review the draft extraction for the same theatre note. Use NHS-style
    theatre booking and clinical coding conventions only as validation
    context: they can help you normalise and check the output, but they must
    not be used to add facts that are absent from the note.

    Check that:
    - has_extractable_note is false for empty, punctuation-only, or
      content-free notes.
    - stated durations are converted to minutes.
    - missing durations are null, never 0.
    - optional missing string fields are null, not empty strings and not
      not_stated, unless the schema explicitly defines not_stated as an
      allowed literal.
    - anaesthesia is normalised to GA, LA, regional, sedation, spinal,
      epidural, or other.
    - laterality is normalised to left, right, bilateral, midline, or
      not_stated.
    - case setting is normalised to day_case, inpatient, outpatient, or
      not_stated.
    - question-marked diagnoses, alternatives, and +/- items are captured in
      uncertainties unless clearly stated as definite.
    - equipment, imaging, implants/materials, medications, histology,
      comorbidities, anticoagulation, mobility needs, and special
      instructions are kept in the correct fields.
    - anaesthetic-only values such as GA or LA are not procedure components.
    - duration and admission setting text are not special instructions.
    - negative imaging statements such as "Xray no" are not listed as required
      imaging.
    - abbreviations are expanded only when the meaning is clear from the note
      or very standard in the theatre context.
    - OPCS-like procedure codes mentioned in the note are preserved exactly.
      Priority codes such as P2/P3/P4 and urgency markers such as 2WW are not
      procedure codes.

    Return the corrected final extraction only. Do not include critique,
    explanation, markdown, or extra keys.

    Theatre note:
    {theatre_note}
  expected_output: >
    The final corrected JSON object matching the TheatreNoteExtraction schema,
    with no unsupported or invented information.
  agent: reviewer
